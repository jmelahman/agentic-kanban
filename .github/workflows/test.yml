name: Tests

on:
  push:
    branches:
      - master
  pull_request:

permissions: {}

jobs:
  detect-modules:
    runs-on: ubuntu-latest
    container:
      image: lahmanja/devcontainer@sha256:09421374d40512ab4c69a3ffb6bb3f6ff5b1528cbd4594f5a8576a6121e44159
      options: --user root
    outputs:
      modules: ${{ steps.set-modules.outputs.modules }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: set-modules
        run: echo "modules=$(go list -m -json | jq -s '.' | jq -c '[.[].Dir]')" >> "$GITHUB_OUTPUT"

  golang:
    needs: detect-modules
    runs-on: ubuntu-latest
    container:
      image: lahmanja/devcontainer@sha256:09421374d40512ab4c69a3ffb6bb3f6ff5b1528cbd4594f5a8576a6121e44159
      options: --user root
    strategy:
      matrix:
        modules: ${{ fromJSON(needs.detect-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: apt-get update && apt-get install -y --no-install-recommends libasound2-dev
      - run: go mod tidy
        working-directory: ${{ matrix.modules }}
      - run: git diff --exit-code go.mod go.sum
        working-directory: ${{ matrix.modules }}
      - run: go test ./...
        working-directory: ${{ matrix.modules }}
        continue-on-error: true
      - name: golangci-lint ${{ matrix.modules }}
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.modules }}
        continue-on-error: true

  pre-commit:
    runs-on: ubuntu-latest
    container:
      image: lahmanja/devcontainer@sha256:09421374d40512ab4c69a3ffb6bb3f6ff5b1528cbd4594f5a8576a6121e44159
      options: --user root
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: prek
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            prek run --from-ref "${{ github.event.pull_request.base.sha }}" --to-ref "${{ github.event.pull_request.head.sha }}"
          else
            prek run --all-files
          fi

  image-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          load: true
          tags: kanban:smoke
          build-args: |
            VERSION=smoke
      - name: assert image entrypoint runs as non-root
        run: |
          uid="$(docker run --rm --entrypoint id kanban:smoke -u)"
          name="$(docker run --rm --entrypoint id kanban:smoke -un)"
          if [ "$uid" != "65532" ] || [ "$name" != "nonroot" ]; then
            echo "expected uid=65532(nonroot), got uid=$uid($name)" >&2
            exit 1
          fi
      - name: boot image and hit API
        run: |
          docker_gid="$(stat -c '%g' /var/run/docker.sock)"
          docker run -d --name kanban-smoke -p 127.0.0.1:7474:7474 \
            --group-add "$docker_gid" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            kanban:smoke --in-memory
          for _ in $(seq 1 30); do
            if curl -sf -m 1 http://127.0.0.1:7474/api/health >/dev/null; then
              ok=1; break
            fi
            sleep 1
          done
          if [ "${ok:-0}" != "1" ]; then
            echo "kanban did not become healthy" >&2
            docker logs kanban-smoke >&2 || true
            exit 1
          fi
          curl -sf -m 5 http://127.0.0.1:7474/api/boards >/dev/null
          run_uid="$(docker exec kanban-smoke id -u)"
          if [ "$run_uid" != "65532" ]; then
            echo "running container uid=$run_uid, expected 65532" >&2
            exit 1
          fi
      - if: always()
        run: docker rm -f kanban-smoke >/dev/null 2>&1 || true
