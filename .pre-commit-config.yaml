default_install_hook_types:
  - pre-commit
  - post-checkout
  - post-merge
  - post-rewrite
repos:
  # See https://prek.j178.dev/builtin/#2-explicit-builtin-repository
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-json
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: trailing-whitespace

  # actionlint and ripsecrets are installed in the devcontainer image (see
  # .devcontainer/Dockerfile). Using language: system avoids prek's
  # `go install` / `cargo install` paths, which fail when the upstream
  # registry's IPs rotate out of the firewall ipset captured at boot.
  - repo: local
    hooks:
      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        types: [yaml]
        files: ^\.github/workflows/
      - id: ripsecrets
        name: ripsecrets
        entry: ripsecrets
        language: system
        args:
          - --strict-ignore
          - --additional-pattern
          - ^sk-[A-Za-z0-9_\-]{20,}$
      # biome is installed via `npm install` in web/ (see web/package.json).
      # The wrapper strips the leading `web/` from each path so biome —
      # invoked inside web/ where its biome.json lives — finds the files.
      - id: biome
        name: biome
        entry: bash -c 'cd web && exec npx --no biome check --no-errors-on-unmatched "${@#web/}"' --
        language: system
        files: ^web/.*\.(ts|tsx|js|jsx|json|jsonc)$
