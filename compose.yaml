services:
  kanban:
    image: lahmanja/kanban:latest
    container_name: kanban
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - lahmanja/kanban:${KANBAN_VERSION:-latest}
      # Build metadata. Resolve on the host since .git is dockerignored and
      # worktrees only stash a gitdir pointer. Set alongside your other env
      # vars when invoking `docker compose up --build`, e.g.:
      #   VERSION=$(git describe --tags --always --dirty) \
      #   docker compose up -d --build
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    # The image entrypoint runs as UID 65532 (nonroot). Override with the
    # invoking host user so bind-mounted dirs under $HOME stay writable, and
    # grant the supplementary GID that owns the docker socket so kanban can
    # spawn session containers. Export DOCKER_SOCK_GID before `docker compose
    # up`, e.g.:
    #   DOCKER_SOCK_GID=$(stat -c '%g' "${DOCKER_SOCK_PATH:-/var/run/docker.sock}") \
    #   docker compose up -d
    user: "${KANBAN_UID:-1000}:${KANBAN_GID:-1000}"
    group_add:
      - "${DOCKER_SOCK_GID:-0}"
    ports:
      - "7474:7474"
      - "13000-13099:13000-13099"
    environment:
      HOME: ${HOME}
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR}
      KANBAN_DATA_DIR: ${HOME}/.local/share/kanban
      GH_TOKEN: ${GH_TOKEN:-}
      DEVCONTAINER_FIREWALL: ${DEVCONTAINER_FIREWALL:-}
      DEVCONTAINER_REMOTE_USER: ${DEVCONTAINER_REMOTE_USER:-}
      DEVCONTAINER_REMOTE_HOME: ${DEVCONTAINER_REMOTE_HOME:-}
      SSH_AUTH_SOCK: ${SSH_AUTH_SOCK:-}
      # Host path of the docker socket, used as the bind source when kanban
      # spawns session containers. Without this, kanban would emit
      # source=/var/run/docker.sock — a path that exists inside this
      # container but not on a rootless-docker host. Tracks the volume
      # source below so the two can't drift.
      KANBAN_HOST_DOCKER_SOCK: ${DOCKER_SOCK_PATH:-/var/run/docker.sock}
    volumes:
      - ${DOCKER_SOCK_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      # Agent config dir. Claude Code reads ~/.claude; for other
      # harnesses (e.g. pi/Ollama) substitute or add the relevant path.
      - ${HOME}/.claude:${HOME}/.claude
      - ${HOME}/.claude.json:${HOME}/.claude.json
      - ${HOME}/code:${HOME}/code
      - ${HOME}/.local/share/kanban:${HOME}/.local/share/kanban
      - ${HOME}/.config/kanban:${HOME}/.config/kanban
    networks:
      - kanban-net

networks:
  kanban-net:
    name: kanban-net
